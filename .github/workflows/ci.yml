name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install companion dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate release metadata
        run: python scripts/validate_version.py

      - name: Test release tooling
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Test companion
        run: python -m unittest discover -s companion -p "test_*.py"

      - name: Test extension
        run: npm --prefix extension test

      - name: Build and validate extension package
        run: npm --prefix extension run package

      - name: Check Homebrew packaging
        run: packaging/homebrew/test.sh
