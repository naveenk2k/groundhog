<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Groundhog transcript</title>
    <style>
      :root { color-scheme: light dark; }
      body { max-width: 760px; margin: 48px auto; padding: 0 24px; font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: CanvasText; background: Canvas; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      #source { color: GrayText; margin: 0 0 4px; }
      #notice { color: GrayText; font-size: 14px; margin: 0 0 28px; }
      #status { color: GrayText; }
      #transcript { white-space: pre-wrap; }
      .error { color: #b3261e; }
    </style>
  </head>
  <body>
    <h1>Transcript</h1>
    <p id="source">Loading…</p>
    <p id="notice" hidden></p>
    <main id="status">Fetching captions…</main>
    <main id="transcript" hidden></main>
    <script src="transcript.js"></script>
  </body>
</html>
